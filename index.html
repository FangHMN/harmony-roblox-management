<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harmony TopUp | Login</title>
  <style>
    :root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f8f4fb;background:#100d19}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#332044,#100d19 65%)}main{width:min(100%,420px);padding:34px;border:1px solid #54405e;border-radius:22px;background:#201729;box-shadow:0 20px 70px #0006}h1{margin:0 0 8px;font-size:27px}p{color:#c9bcd0;margin:0 0 26px}label{display:block;margin:15px 0 7px;font-size:14px}input{width:100%;padding:13px 14px;border:1px solid #6b5774;border-radius:11px;background:#130e1b;color:white;font:inherit}input:focus{outline:2px solid #d59ce5}button{width:100%;margin-top:23px;padding:13px;border:0;border-radius:11px;background:#e4a8e8;color:#23112a;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{margin-top:17px;min-height:24px;color:#ffb9c1;font-size:14px}.ok{color:#baf0d0}.small{font-size:12px;color:#a899b2;margin-top:12px}
  </style>
</head>
<body>
<main>
  <h1>Harmony TopUp ♡</h1>
  <p>Roblox Management — เข้าสู่ระบบสำหรับพนักงาน</p>
  <form id="login-form">
    <label for="email">อีเมล</label><input id="email" type="email" autocomplete="username" required />
    <label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" required />
    <button id="login-button" type="submit">เข้าสู่ระบบ</button>
  </form>
  <div id="message" class="msg" role="status" aria-live="polite"></div>
  <div class="small">สำหรับบัญชีที่ได้รับอนุญาตจากร้านเท่านั้น</div>

<section id="dashboard" hidden>
  <h2>Harmony TopUp Dashboard</h2>
  <p id="dashboard-role"></p>

  <nav aria-label="เมนูจัดการร้าน">
    <button type="button" id="menu-sales">บันทึกการขาย</button>

    <div id="owner-menu" hidden>
      <button type="button">บัญชี Microsoft</button>
      <button type="button">บัญชี Roblox</button>
      <button type="button">จัดการสต็อก</button>
      <button type="button">รายงานยอดขายและกำไร</button>
      <button type="button">จัดการพนักงาน</button>
    </div>
  </nav>

  <p>ยินดีต้อนรับเข้าสู่ระบบจัดการร้าน Harmony TopUp</p>
  <section id="sales-page" hidden>
  <h3>บันทึกการขาย Roblox</h3>

  <form id="sales-form">
    <label for="sale-date">วันที่ขาย</label>
    <input id="sale-date" type="date" required>

    <label for="customer-channel">ช่องทางลูกค้า</label>
    <select id="customer-channel" required>
      <option value="LINE">LINE</option>
      <option value="Facebook">Facebook</option>
    </select>

    <label for="customer-name">ชื่อลูกค้า</label>
    <input id="customer-name" type="text" required>

    <label for="roblox-username">Roblox Username</label>
    <input id="roblox-username" type="text">

    <label for="sale-type">ประเภทการขาย</label>
    <select id="sale-type" required>
      <option value="topup">แบบเติม (Microsoft)</option>
      <option value="send">แบบส่ง (Roblox)</option>
    </select>
<div id="microsoft-sale-fields">
  <label for="microsoft-account">บัญชี Microsoft</label>
  <select id="microsoft-account">
    <option value="">-- เลือกบัญชี Microsoft --</option>
  </select>

 <label>แพ็ก Robux ที่เติม</label>

<div id="package-list">
  <div class="package-row">
    <select class="package-select">
      <option value="">-- เลือกแพ็ก Robux --</option>
    </select>

    <input
      class="package-quantity"
      type="number"
      min="1"
      value="1"
      aria-label="จำนวนแพ็ก"
    >
  </div>
</div>

<button type="button" id="add-package-button">
  + เพิ่มแพ็ก Robux
</button>

<p id="package-total">รวม 0 Robux</p>
</div>
    <label for="robux-amount">จำนวน Robux</label>
    <input id="robux-amount" type="number" min="1" required>

    <label for="sale-price">ราคาขาย (บาท)</label>
    <input id="sale-price" type="number" min="0" step="0.01" required>

    <label for="sale-notes">หมายเหตุ</label>
    <textarea id="sale-notes" rows="3"></textarea>

    <button type="submit" disabled>บันทึกการขาย (รอเชื่อมระบบ)</button>
  </form>
</section>
  <button type="button" id="logout-button">ออกจากระบบ</button>
</section>
</main>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  // Replace both placeholders with Project URL and publishable/anon key from Supabase.
  // Never put a service_role or secret key in a public GitHub repository.
  const SUPABASE_URL = 'https://dgidqngzaujmleyfcegp.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_qcbg7LNiRHb04jGZxBWJzg_6E1WWF03';
  const message = document.getElementById('message');
  const button = document.getElementById('login-button');
  const show = (text, ok=false) => { message.textContent=text; message.className='msg'+(ok?' ok':''); };
  if (SUPABASE_URL.startsWith('PASTE_') || SUPABASE_PUBLISHABLE_KEY.startsWith('PASTE_')) {
    show('กรุณาตั้งค่า Supabase URL และ Publishable Key ในไฟล์ index.html ก่อน');
    button.disabled = true;
  } else {
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    
async function loadMicrosoftOptions() {
  const accountSelect = document.getElementById('microsoft-account');
  const packageList = document.getElementById('package-list');

  accountSelect.innerHTML = '<option value="">-- เลือกบัญชี Microsoft --</option>';
  packageList.querySelectorAll('.package-select').forEach(select => {
  select.innerHTML = '<option value="">-- เลือกแพ็ก Robux --</option>';
});

  const { data: accounts, error: accountError } =
    await supabase.rpc('get_staff_microsoft_accounts');

  if (accountError) throw accountError;

  for (const account of accounts || []) {
    const option = document.createElement('option');
    option.value = account.id;
    option.textContent = account.account_name;
    accountSelect.appendChild(option);
  }

  const { data: packages, error: packageError } =
    await supabase
      .from('microsoft_packages')
      .select('id,robux_amount,currency,package_price')
      .eq('active', true)
      .order('robux_amount');

  if (packageError) throw packageError;

  const packageOptions = packages || [];

function fillPackageSelect(select) {
  select.innerHTML = '<option value="">-- เลือกแพ็ก Robux --</option>';

  for (const pack of packageOptions) {
    const option = document.createElement('option');
    option.value = pack.id;
    option.dataset.robux = pack.robux_amount;
    option.textContent =
      `${pack.robux_amount} Robux (${pack.package_price} ${pack.currency})`;
    select.appendChild(option);
  }
}

packageList.querySelectorAll('.package-select').forEach(fillPackageSelect);
}
function updatePackageTotal() {
  let total = 0;

  document.querySelectorAll('.package-row').forEach(row => {
    const select = row.querySelector('.package-select');
    const quantity = Number(row.querySelector('.package-quantity').value);

    const option = select.selectedOptions[0];
    const robux = Number(option?.dataset.robux || 0);

    total += robux * quantity;
  });

  document.getElementById('package-total').textContent =
    `รวม ${total.toLocaleString()} Robux`;

  document.getElementById('robux-amount').value = total || '';
}

document.getElementById('add-package-button').addEventListener('click', () => {
  const list = document.getElementById('package-list');
  const firstRow = list.querySelector('.package-row');
  const newRow = firstRow.cloneNode(true);

  newRow.querySelector('.package-select').value = '';
  newRow.querySelector('.package-quantity').value = 1;

  list.appendChild(newRow);
  updatePackageTotal();
});

document.getElementById('package-list').addEventListener('change', updatePackageTotal);
document.getElementById('package-list').addEventListener('input', updatePackageTotal);
    async function checkRole(user) {
      const { data, error } = await supabase.from('staff_profiles')
        .select('role,active').eq('user_id', user.id).maybeSingle();
      if (error) throw error;
      if (!data?.active || !['owner','staff'].includes(data.role)) {
        await supabase.auth.signOut();
        show('บัญชีนี้ไม่ได้รับอนุญาตให้ใช้งานระบบ');
        return;
      }
      // Placeholder for later protected pages. Do not treat client-side role checks as security.
      document.getElementById('login-form').hidden=true;
document.getElementById('dashboard').hidden = false;
document.getElementById('dashboard-role').textContent =
  `สิทธิ์ผู้ใช้งาน: ${data.role}`;

document.getElementById('owner-menu').hidden =
  data.role !== 'owner';

      show(`เข้าสู่ระบบสำเร็จ (${data.role}) — พร้อมเชื่อม Dashboard ในขั้นตอนถัดไป`,true);
      try {
  await loadMicrosoftOptions();
} catch (err) {
  console.error('โหลดข้อมูล Microsoft ไม่สำเร็จ:', err);
  show('เข้าสู่ระบบสำเร็จ แต่โหลดบัญชี Microsoft หรือแพ็ก Robux ไม่สำเร็จ');
}
    }
    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user) {
      try { await checkRole(session.user); } catch { show('ตรวจสอบสิทธิ์ไม่สำเร็จ กรุณาลองใหม่'); }
    }
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault(); button.disabled=true; show('กำลังเข้าสู่ระบบ...');
      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email:document.getElementById('email').value.trim(),
          password:document.getElementById('password').value
        });
        if(error) throw error;
        await checkRole(data.user);
      } catch(err) { show(err.message === 'Invalid login credentials' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : 'เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบข้อมูลและลองใหม่'); }
      finally { button.disabled=false; }
    });
    
document.getElementById('logout-button').addEventListener('click', async () => {
  const { error } = await supabase.auth.signOut();

  if (error) {
    show('ออกจากระบบไม่สำเร็จ กรุณาลองใหม่');
    return;
  }

  document.getElementById('dashboard').hidden = true;
  document.getElementById('owner-menu').hidden = true;
  document.getElementById('login-form').hidden = false;
  document.getElementById('password').value = '';
  show('ออกจากระบบเรียบร้อยแล้ว', true);
});
document.getElementById('menu-sales').addEventListener('click', () => {
  const salesPage = document.getElementById('sales-page');
  salesPage.hidden = false;
  salesPage.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
  }
</script>
</body>
</html>
